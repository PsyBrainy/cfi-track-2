<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkywall</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
    <div class="container header__inner">
        <a href="#" class="logo">Alkywall</a>
        <nav class="nav">
            <ul class="nav__list">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#billetera">Mi billetera</a></li>
                <li><a href="#movimientos">Movimientos</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="site-main container">
    <section id="inicio" class="hero">
        <h1>Bienvenido a Alkywall</h1>
        <button class="btn btn--primary">Empezar ahora</button>
    </section>

    <section id="billetera" class="cards">
        <article class="card">
            <h2>Saldo disponible</h2>
            <p>Consultá tu saldo en tiempo real.</p>
        </article>
        <article class="card">
            <h2>Transferencias</h2>
            <p>Enviá y recibí dinero fácilmente.</p>
        </article>
        <article class="card">
            <h2>Historial</h2>
            <p>Revisá todos tus movimientos.</p>
        </article>
    </section>
</main>

<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 Alkywall. Todos los derechos reservados.</p>
    </div>
</footer>

<script src="main.js"></script>
</body>
</html>
