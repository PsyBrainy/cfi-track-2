<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkywall - Depósito</title>
    <link rel="stylesheet" href="deposito.module.css">
    <link rel="stylesheet" href="wallet-theme.css">
    <link rel="stylesheet" href="components/navbar.css">
    <script type="module" src="js/tokenCheck.js"></script>

</head>
<body style="display: none;">
<div id="global-navbar"></div>

<main class="wallet-page container">
    <section class="wallet-heading">
        <span class="wallet-eyebrow">Tu billetera</span>
        <h1>Mové tu dinero</h1>
        <p>Depositá fondos de forma rápida y segura.</p>
    </section>

    <section class="deposit-layout">
        <article class="balance-panel">
            <span class="panel-label">Saldo disponible</span>
            <strong id="saldo">Cargando...</strong>
            <span class="panel-caption">Pesos argentinos</span>
        </article>

        <article class="deposit-panel">
            <div class="panel-heading">
                <span class="panel-index">01</span>
                <div>
                    <h2>Agregar saldo</h2>
                    <p>Elegí cuánto querés ingresar.</p>
                </div>
            </div>

            <label for="monto">Monto a depositar</label>
            <div class="deposit-amount-field">
                <span>$</span>
                <input type="number"
                       id="monto"
                       name="amount"
                       placeholder="0,00"
                       min="1"
                       step="0.01"
                       inputmode="decimal">
            </div>
            <button id="btnCargar" class="btn btn--primary" onclick="depositar()">Cargar saldo</button>
        </article>
    </section>
</main>

<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 Alkywall. Todos los derechos reservados.</p>
    </div>
</footer>

<!-- CDN de Alertas Visuales -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ORDEN DE CARGA MODULAR -->
<script type="module" src="js/navbar-loader.js"></script>
<script type="module" src="js/depositEntry.js"></script>
<script src="deposit.js"></script> 
</body>
</html>
