<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkywall - Depósito</title>
    <link rel="stylesheet" href="deposito.module.css">
    <link rel="stylesheet" href="wallet-theme.css">
    <link rel="stylesheet" href="components/navbar.css">
    <link rel="stylesheet" href="components/footer.css">

    <script type="module" src="js/tokenCheck.js"></script>
    
</head>
<body style="display: none;">
<div id="global-navbar"></div>

<main class="wallet-page container">
    <section class="wallet-heading">
        <span class="wallet-eyebrow">Tu billetera</span>
        <h1>Mové tu dinero</h1>
        <p>Depositá fondos de forma rápida y segura.</p>
    </section>

    <section class="deposit-layout">
        <!-- Tarjeta de Saldo Izquierda -->
        <article class="balance-panel" style="display: flex; flex-direction: column; justify-content: space-between; padding: 30px; min-height: 200px;">
            <span class="panel-label" style="color: #ffffff; opacity: 0.85; font-size: 0.95rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Saldo disponible</span>
            
            <strong id="saldo" style="color: #ffffff !important; font-size: 2.6rem !important; font-weight: 800 !important; letter-spacing: -1px !important; margin: 15px 0; display: block; align-self: flex-start;">
                $ 0,00
            </strong>
            
            <span class="panel-caption" style="color: #ffffff; opacity: 0.65; font-size: 0.9rem;">Pesos argentinos</span>
        </article>

        <!-- Panel de Formulario Derecho -->
        <article class="deposit-panel">
            <div class="panel-heading">
                <span class="panel-index">01</span>
                <div>
                    <h2>Agregar saldo</h2>
                    <p>Elegí cuánto querés ingresar.</p>
                </div>
            </div>

            <label for="monto">Monto a depositar</label>
            <div class="deposit-amount-field" style="display: flex; align-items: center; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px;">
                <span style="font-size: 2.5rem; font-weight: 700; color: #1e293b; margin-right: 8px;">$</span>
                <input type="number"
                       id="monto"
                       name="amount"
                       placeholder="0,00"
                       min="1"
                       step="0.01"
                       inputmode="decimal"
                       style="font-size: 2.5rem !important; font-weight: 700 !important; color: #1e293b !important; width: 100%; border: none !important; outline: none !important; padding: 5px 0; background: transparent;">
            </div>
            <button id="btnCargar" class="btn btn--primary" onclick="depositar()">Cargar saldo</button>
        </article>
    </section>
</main>

<div id="global-footer"></div>

<script type="module" src="js/footer-loader.js"></script>
<!-- CDN de Alertas Visuales -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- ORDEN DE CARGA MODULAR -->
<script type="module" src="js/navbar-loader.js"></script>
<script type="module" src="js/depositEntry.js"></script>
<script src="deposit.js"></script> 
</body>
</html>
