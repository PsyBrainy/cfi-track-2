<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · Alkywall</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
    <div class="container header__inner">
        <a href="index.html" class="logo">Alkywall</a>
    </div>
</header>

<main class="site-main container">
    <section id="login" class="auth-section">
        <h2>Iniciar sesión</h2>

        <form id="login-form" class="auth-form" novalidate>
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="text" id="login-email" name="login-email" placeholder="tuemail@ejemplo.com">
                <span class="error-message" id="login-email-error"></span>
            </div>

            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" name="login-password" placeholder="Tu contraseña">
                <span class="error-message" id="login-password-error"></span>
            </div>

            <div class="form-feedback" id="login-feedback"></div>

            <button type="submit" class="btn btn--primary">Ingresar</button>
        </form>

        <p class="auth-switch">¿Aún no tenés cuenta? <a href="registro.html">Registrate</a></p>
    </section>
</main>

<footer class="site-footer">
    <div class="container">
        <p>&copy; 2026 Alkywall. Todos los derechos reservados.</p>
    </div>
</footer>

<script type="module" src="js/loginEntry.js"></script>
</body>
</html>
